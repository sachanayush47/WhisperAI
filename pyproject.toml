[project]
name = "whisperai"
version = "0.1.0"
description = "An open source alternative of AssemblyAI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "~=3.13.0"
dependencies = [
    "faster-whisper==1.2.1",
    "pyannote.audio==3.1.1",
    "pydub==0.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whisperai"]
